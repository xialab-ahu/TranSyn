extractors:
  biological:
    working_directory: "{config_dir}"
    command:
      - conda
      - run
      - --no-capture-output
      - -n
      - bio_feature
      - python
      - 4-Retrieve-biology.py
      - --input_file
      - "{input}"
      - --task_dir
      - "{output_dir}"
      - --resource_config
      - "{config_dir}/local.biological-resources.yaml"
    output: "{output_dir}/biological.raw.txt"
    required_modules: [numpy, pandas, sklearn, joblib, yaml]
  gpn_msa:
    working_directory: "{config_dir}"
    command:
      - conda
      - run
      - --no-capture-output
      - -n
      - GPNMSA
      - python
      - 2-Retrieve-GPN-MSA-Embeddings.py
      - --input_file
      - "{input}"
      - --task_dir
      - "{output_dir}"
      - --model_path
      - /path/to/downloaded/GPN-MSA/model
      - --msa_path
      - /path/to/downloaded/GPN-MSA/89.zarr.zip
    output: "{output_dir}/GPN_MSA.pth"
    required_modules: [torch, gpn, transformers, lmdb]
  codon_context:
    working_directory: "{config_dir}"
    command:
      - conda
      - run
      - --no-capture-output
      - -n
      - calm
      - python
      - 3-Retrieve-cds-info.py
      - --task_dir
      - "{output_dir}"
      - --transcript_info
      - /path/to/transcript_id_info_summary.txt
    output: "{output_dir}/input.codon.txt"
    required_modules: [pandas, tqdm]
  calm:
    working_directory: "{config_dir}"
    command:
      - conda
      - run
      - --no-capture-output
      - -n
      - calm
      - python
      - 1-Retrieve-CaLM-Embeddings.py
      - --input_file
      - "{output_dir}/input.codon.txt"
      - --task_dir
      - "{output_dir}"
    output: "{output_dir}/CaLM.pth"
    required_modules: [torch, calm, pandas, tqdm, lmdb]
normalization:
  selected_columns: ../config/reformat_header.info
  empty_columns: ../config/empty_cols.pkl
  imputer: ../config/imputer.pkl
  scaler: ../config/scaler.pkl
  identifier_column: Variant38
  metadata_columns: 3
  gpn_field: gpn_msa
  calm_field: calm_diff
